name: Publish Docker image

# Builds and publishes a multi-arch (amd64 + arm64) image to GHCR on:
#   - any v*.*.* tag             -> semver tags (2.0.0, 2.0, 2, latest, sha-*)
#   - every push to main         -> 'main' + 'sha-<short>' (edge, not 'latest')
#   - manual workflow_dispatch   -> same as a main push
#
# Image is signed keyless with cosign via GitHub's OIDC, and ships with
# build provenance + SBOM attestations. Users can verify with:
#
#   cosign verify \
#     --certificate-identity 'https://github.com/maciekaz/ESET-MCP/.github/workflows/publish-image.yml@refs/tags/v2.0.0' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     ghcr.io/maciekaz/eset-mcp:2.0.0

on:
  push:
    tags: ['v*.*.*']
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write       # push to GHCR
  id-token: write       # cosign keyless via OIDC
  attestations: write   # SLSA build provenance attestation

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/eset-mcp

jobs:
  validate:
    uses: ./.github/workflows/integration.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate release versions
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import ast, json, os, pathlib, tomllib
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          assert tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'] == version
          tree = ast.parse(pathlib.Path('eset_mcp/__init__.py').read_text())
          assert next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets)) == version
          metadata = json.loads(pathlib.Path('server.json').read_text())
          assert metadata['version'] == version
          assert metadata['packages'][0]['identifier'] == f'ghcr.io/maciekaz/eset-mcp:{version}'
          PY

      - uses: docker/setup-qemu-action@v3       # enables arm64 builds on amd64 runner
      - uses: docker/setup-buildx-action@v3     # BuildKit + cache backends

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=ESET-MCP
            org.opencontainers.image.description=MCP server for the ESET ecosystem (Connect cloud + PROTECT On-Prem)
            org.opencontainers.image.licenses=MIT
          annotations: |
            io.modelcontextprotocol.server.name=io.github.maciekaz/eset-mcp

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install pinned Cosign
        run: |
          curl -fsSL https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64 -o "$RUNNER_TEMP/cosign"
          echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  $RUNNER_TEMP/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE_REF="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          cosign sign --yes "$IMAGE_REF"
          cosign verify \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-image.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_REF"
          echo "Signed and verified: $IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"

      # MCP Registry publish - only on v*.*.* tags, not on main pushes.
      # The registry verifies ownership by reading the
      # io.modelcontextprotocol.server.name annotation off the manifest at
      # the identifier in server.json - so this MUST run after the image
      # was pushed (which it is, build-push-action step above completed).
      - name: Install mcp-publisher
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -fsSL \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" mcp-publisher

      - name: Validate server.json against MCP schema
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./mcp-publisher validate ./server.json

      - name: Publish to MCP Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
