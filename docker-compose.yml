services:
  # --- Local HTTP server built from this checkout ---
  # HTTP mode (Streamable HTTP, MCP spec 2026-07-28 (legacy clients supported)) on 0.0.0.0:8765/mcp.
  # Start with: docker compose --profile http up --build -d
  # Contributors hacking on source: see eset-mcp-http-dev below.
  eset-mcp-http:
    profiles: ["http"]
    build: .
    image: eset-mcp:2.0.0-local
    container_name: eset-mcp-http
    restart: unless-stopped
    env_file: .env
    environment:
      ESET_MCP_TRANSPORT: http
      ESET_MCP_HTTP_HOST: 0.0.0.0
      ESET_AUTH_MODE: basic
      ESET_MCP_HTTP_PORT: "8765"
      ESET_MCP_ALLOWED_HOSTS: ${ESET_MCP_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*}
    ports:
      - "127.0.0.1:8765:8765"
    networks: [eset-mcp]

  # --- stdio one-shot (Claude Desktop / Claude Code locally) ---
  # `docker compose --profile stdio run --build --rm eset-mcp-stdio`
  eset-mcp-stdio:
    build: .
    image: eset-mcp:2.0.0-local
    profiles: ["stdio"]
    env_file: .env
    environment:
      ESET_MCP_TRANSPORT: stdio
    stdin_open: true
    tty: false

  # --- Contributor / source-built profile ---
  # `docker compose --profile dev up --build eset-mcp-http-dev`
  # Builds from the local Dockerfile.
  # Use this when iterating on code; otherwise stick with eset-mcp-http.
  eset-mcp-http-dev:
    build: .
    profiles: ["dev"]
    container_name: eset-mcp-http-dev
    restart: unless-stopped
    env_file: .env
    environment:
      ESET_MCP_TRANSPORT: http
      ESET_MCP_HTTP_HOST: 0.0.0.0
      ESET_AUTH_MODE: basic
      ESET_MCP_HTTP_PORT: "8765"
      ESET_MCP_ALLOWED_HOSTS: ${ESET_MCP_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*}
    ports:
      - "127.0.0.1:8765:8765"
    networks: [eset-mcp]

  # --- Production (prod profile): Caddy + auto-HTTPS in front of MCP ---
  # docker compose --profile prod up -d
  # Requires ESET_PUBLIC_DOMAIN and ESET_ACME_EMAIL in .env, plus the host
  # being reachable from the public internet on ports 80 and 443.
  caddy:
    image: caddy:2.11.7-alpine
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      # Defer prod validation to Caddy so local profiles need no public domain.
      ESET_PUBLIC_DOMAIN: ${ESET_PUBLIC_DOMAIN:-}
      ESET_ACME_EMAIL: ${ESET_ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [eset-mcp]
    depends_on: [eset-mcp-http-prod]

  # Source build, internal-only in prod (no published
  # port) and joined to the same network as Caddy.
  eset-mcp-http-prod:
    build: .
    image: eset-mcp:2.0.0-local
    profiles: ["prod"]
    container_name: eset-mcp-http-prod
    restart: unless-stopped
    env_file: .env
    environment:
      ESET_MCP_TRANSPORT: http
      ESET_MCP_HTTP_HOST: 0.0.0.0
      ESET_AUTH_MODE: basic
      ESET_MCP_HTTP_PORT: "8765"
      ESET_MCP_ALLOWED_HOSTS: ${ESET_PUBLIC_DOMAIN:-localhost}
    expose:
      - "8765"
    networks: [eset-mcp]


networks:
  eset-mcp:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
